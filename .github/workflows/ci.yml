name: "CI/CD Frontend - Innovatech Chile"

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  build-and-push:
    name: "Build React → ECR"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout código"
        uses: actions/checkout@v4

      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: "Login en Amazon ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build y Push imagen Frontend"
        env:
          ECR_WEB_URI: ${{ secrets.ECR_WEB_URI }}
        run: |
          docker build \
            --tag $ECR_WEB_URI:$IMAGE_TAG \
            --tag $ECR_WEB_URI:latest \
            .
          docker push $ECR_WEB_URI:$IMAGE_TAG
          docker push $ECR_WEB_URI:latest

  deploy:
    name: "Deploy Frontend en EC2"
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: "Deploy Frontend en EC2 via SSM"
        env:
          ECR_WEB_URI:  ${{ secrets.ECR_WEB_URI }}
          EC2_WEB_ID:   ${{ secrets.EC2_WEB_ID }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_WEB_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Frontend - $IMAGE_TAG" \
            --parameters commands="[
              'aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_WEB_URI',
              'sudo docker pull $ECR_WEB_URI:latest',
              'sudo docker stop alumnos-web 2>/dev/null || true',
              'sudo docker rm   alumnos-web 2>/dev/null || true',
              'sudo docker run -d --name alumnos-web --restart unless-stopped -p 80:80 -e BACKEND_HOST=$BACKEND_HOST $ECR_WEB_URI:latest',
              'sudo docker image prune -f'
            ]" \
            --region "$AWS_REGION" \
            --output text